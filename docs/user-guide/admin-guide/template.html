<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claims Workspace — Administrator Guide v{{VERSION}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfbfd; --surface: #ffffff; --surface-2: #f4f4f7;
    --fg: #0f172a; --fg-strong: #020617; --muted: #64748b; --muted-strong: #475569;
    --border: #e4e4ea; --border-strong: #d4d4dc;
    --accent: #f59e0b; --accent-deep: #d97706; --accent-soft: #fff7ed;
    --brand: #0f4c8a; --brand-soft: #eff6ff;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.06);
    --shadow-md: 0 4px 12px -2px rgba(15,23,42,0.06);
    --radius: 10px;
    --hero-grad: linear-gradient(135deg, #0f4c8a 0%, #1e7fc7 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #08080b; --surface: #111118; --surface-2: #16161e;
      --fg: #e4e4e7; --fg-strong: #fafafa; --muted: #9ca3af; --muted-strong: #cbd5e1;
      --border: #27272f; --border-strong: #3a3a44;
      --brand: #3b82f6; --brand-soft: rgba(59,130,246,0.1);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; font-family: 'Inter', -apple-system, sans-serif;
    font-size: 15px; line-height: 1.7; color: var(--fg); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* Cover */
  .cover {
    background: var(--hero-grad); color: white;
    padding: 4rem 3rem; display: flex; flex-direction: column; justify-content: flex-end;
    min-height: 220px; position: relative; overflow: hidden;
  }
  .cover::after {
    content: ""; position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .cover-eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; margin-bottom: 0.5rem; position: relative; z-index: 1; }
  .cover h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 800; margin: 0 0 0.5rem; letter-spacing: -0.02em; line-height: 1.1; position: relative; z-index: 1; }
  .cover-meta { font-size: 0.88rem; opacity: 0.75; margin: 0; position: relative; z-index: 1; }

  /* Layout */
  .page { max-width: 1320px; margin: 0 auto; padding: 0 clamp(1rem, 3vw, 2.5rem); }
  .layout { display: grid; grid-template-columns: minmax(0,1fr); gap: 3rem; padding: 2rem 0 6rem; }
  @media (min-width: 1100px) { .layout { grid-template-columns: 260px minmax(0,1fr); align-items: start; } }
  main { min-width: 0; max-width: 860px; }

  /* Sidebar */
  .sidebar { display: none; }
  @media (min-width: 1100px) {
    .sidebar {
      display: block; position: sticky; top: 2rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.2rem 1rem;
      box-shadow: var(--shadow-sm); font-size: 0.82rem; max-height: 90vh; overflow-y: auto;
    }
  }
  .sidebar-title { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.8rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
  .sidebar nav a { display: block; padding: 0.3rem 0.5rem; border-radius: 5px; color: var(--muted-strong); font-weight: 500; text-decoration: none; transition: background 0.1s, color 0.1s; margin-bottom: 0.05rem; }
  .sidebar nav a:hover { background: var(--surface-2); color: var(--fg-strong); }
  .sidebar nav a.section-link { font-size: 0.78rem; padding-left: 1rem; color: var(--muted); }

  /* Typography */
  h2 {
    font-size: 1.55rem; font-weight: 700; letter-spacing: -0.02em; color: var(--fg-strong);
    margin: 3.5rem 0 1rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--border);
    scroll-margin-top: 80px; position: relative;
  }
  h2::before { content: ""; position: absolute; bottom: -2px; left: 0; width: 48px; height: 2px; background: var(--hero-grad); border-radius: 2px; }
  h3 { font-size: 1.12rem; font-weight: 700; color: var(--fg-strong); margin: 2rem 0 0.5rem; scroll-margin-top: 80px; }
  h4 { font-size: 0.96rem; font-weight: 600; color: var(--brand); margin: 1.4rem 0 0.4rem; }
  p { margin: 0.9rem 0; }
  ul, ol { padding-left: 1.4rem; margin: 0.8rem 0; }
  li { margin: 0.45rem 0; line-height: 1.65; }
  li::marker { color: var(--muted); }
  strong { color: var(--fg-strong); font-weight: 600; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }
  a { color: var(--brand); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  blockquote {
    margin: 1rem 0; padding: 0.6rem 1rem;
    border-left: 3px solid var(--border-strong); background: var(--surface-2);
    color: var(--muted-strong); border-radius: 0 var(--radius) var(--radius) 0;
    font-size: 0.93rem;
  }
  blockquote strong { color: var(--muted-strong); }

  /* Tables */
  .table-wrap { overflow-x: auto; margin: 1.2rem 0; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.9rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
  th, td { text-align: left; padding: 0.65rem 0.9rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--surface-2); font-weight: 600; color: var(--fg-strong); font-size: 0.8rem; letter-spacing: 0.03em; text-transform: uppercase; border-bottom: 1px solid var(--border-strong); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface-2); }

  /* Callouts */
  .note { background: var(--brand-soft); border-left: 4px solid var(--brand); padding: 0.8rem 1.1rem; border-radius: 0 var(--radius) var(--radius) 0; font-size: 0.93rem; margin: 1.2rem 0; }
  .warn { background: var(--accent-soft); border-left: 4px solid var(--accent); padding: 0.8rem 1.1rem; border-radius: 0 var(--radius) var(--radius) 0; font-size: 0.93rem; margin: 1.2rem 0; }

  /* Screen captures */
  figure.screenshot { margin: 1.4rem 0; }
  figure.screenshot img { max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-md); display: block; }
  figure.screenshot figcaption { font-size: 0.82rem; color: var(--muted); margin-top: 0.4rem; text-align: center; font-style: italic; }

  /* Print styles */
  @media print {
    .sidebar { display: none !important; }
    .layout { grid-template-columns: 1fr !important; }
    h2 { page-break-before: always; }
    h2:first-of-type { page-break-before: avoid; }
    figure.screenshot img { max-width: 85%; }
    body { font-size: 11pt; line-height: 1.5; }
    .cover { min-height: auto; padding: 2rem; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>

<div class="cover">
  <div class="cover-eyebrow">Claims Workspace™</div>
  <h1>Administrator Guide</h1>
  <p class="cover-meta">Version {{VERSION}} &nbsp;·&nbsp; {{DATE}} &nbsp;·&nbsp; Issue {{ISSUE}}</p>
</div>

<div class="page">
  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-title">Contents</div>
      <nav id="toc">
        {{TOC}}
      </nav>
    </aside>

    <main id="content">
      {{CONTENT}}
    </main>

  </div>
</div>

</body>
</html>
